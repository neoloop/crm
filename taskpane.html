<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<title>CRM SIC</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root{color-scheme:light dark;--tx:#17202a;--mu:#5b6573;--line:#d9dee5;--bg:#fff;--red:#c8102e;--hov:#f2f4f7}
  @media (prefers-color-scheme:dark){:root{--tx:#e8ecf1;--mu:#9aa6b4;--line:#2c3642;--bg:#18202a;--red:#e8344f;--hov:#222c38}}
  *{box-sizing:border-box}
  body{margin:0;padding:14px;font:14px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--tx);background:var(--bg)}
  h1{font-size:15px;margin:0 0 4px}
  .mu{color:var(--mu);font-size:12.5px}
  .sub{margin:0 0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .p .t{flex:1;min-width:0}
  .p b,.p .e{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p .e{color:var(--mu);font-size:12.5px}
  .role{font-size:11.5px;color:var(--mu)}
  a.btn{flex:none;text-decoration:none;color:#fff;background:var(--red);padding:6px 11px;border-radius:4px;font-size:13px;font-weight:600}
  a.btn:hover{filter:brightness(1.1)}
  input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--tx);font:inherit}
  .cfg{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .cfg summary{cursor:pointer;color:var(--mu);font-size:12.5px}
  label.chk{display:flex;gap:7px;align-items:center;margin:10px 0 0;font-size:13px}
  label.chk input{width:auto;accent-color:var(--red)}
</style>
</head>
<body>
<h1 id="ttl">Ajouter au CRM SIC</h1>
<p class="mu sub" id="subj">Chargement…</p>
<div id="list"></div>
<label class="chk" id="logrow"><input type="checkbox" id="log" checked> Noter ce mail dans l'historique du contact</label>
<details class="cfg" id="cfg"><summary>Adresse du CRM</summary>
  <p><input id="crm" placeholder="http://10.220.30.115:8095"></p>
  <p class="mu">Enregistrée dans ce navigateur. Elle peut aussi être fixée dans le manifeste (?crm=…).</p></details>

<script>
(function () {
  var qp = new URLSearchParams(location.search), KEY = 'crmsic_url', crm = '';
  function store(v) { try { if (v === undefined) return localStorage.getItem(KEY) || ''; localStorage.setItem(KEY, v); } catch (e) { return ''; } return ''; }
  crm = (qp.get('crm') || store() || '').replace(/\/+$/, '');
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  $('crm').value = crm;
  $('crm').addEventListener('change', function () { crm = this.value.trim().replace(/\/+$/, ''); store(crm); draw(); });

  function people(item) {
    var me = ((Office.context.mailbox.userProfile || {}).emailAddress || '').toLowerCase(), seen = {}, out = [];
    function add(list, role) {
      [].concat(list || []).forEach(function (p) {
        var a = ((p && p.emailAddress) || '').trim().toLowerCase();
        if (!a || a === me || seen[a]) return;
        seen[a] = 1; out.push({name: p.displayName || '', email: a, role: role});
      });
    }
    add(item.from, 'Expéditeur'); add(item.to, 'Destinataire'); add(item.cc, 'En copie');
    return out;
  }
  function link(p, item) {
    var u = crm + '/#/ajout?email=' + encodeURIComponent(p.email) + '&nom=' + encodeURIComponent(p.name);
    if ($('log').checked) u += '&sujet=' + encodeURIComponent(item.subject || '') + '&date=' + encodeURIComponent((item.dateTimeCreated ? new Date(item.dateTimeCreated) : new Date()).toISOString().slice(0, 10));
    return u;
  }
  var item = null;
  // lit un champ de participants : tableau (lecture) ou objet à getAsync (rédaction)
  function getList(field, cb) {
    if (field && typeof field.getAsync === 'function') field.getAsync(function (r) { cb(r.status === Office.AsyncResultStatus.Succeeded ? r.value : []); });
    else cb(field || []);
  }
  function getVal(field, cb) {
    if (field && typeof field.getAsync === 'function') field.getAsync(function (r) { cb(r.status === Office.AsyncResultStatus.Succeeded ? r.value : ''); });
    else cb(field);
  }
  function draw() {
    if (!item) return;
    var isMeeting = item.itemType === 'appointment' || item.itemType === Office.MailboxEnums.ItemType.Appointment;
    $('ttl').textContent = isMeeting ? 'Réunion → CRM SIC' : 'Ajouter au CRM SIC';
    $('logrow').style.display = isMeeting ? 'none' : '';
    if (!crm) { $('cfg').open = true; $('list').innerHTML = '<p class="mu">Renseigne d\'abord l\'adresse du CRM ci-dessous.</p>'; return; }
    if (isMeeting) return drawMeeting();
    getVal(item.subject, function (s) { $('subj').textContent = s || '(sans objet)'; });
    var list = people(item);
    $('list').innerHTML = list.length ? list.map(function (p) {
      return '<div class="p"><div class="t"><b>' + esc(p.name || p.email) + '</b><span class="e">' + esc(p.email) + '</span><span class="role">' + p.role + '</span></div>' +
        '<a class="btn" target="_blank" rel="noopener" href="' + esc(link(p, item)) + '">Ajouter</a></div>';
    }).join('') : '<p class="mu">Aucune autre personne dans ce mail.</p>';
  }
  function drawMeeting() {
    var me = ((Office.context.mailbox.userProfile || {}).emailAddress || '').toLowerCase();
    getVal(item.subject, function (subject) {
      getVal(item.start, function (start) {
        getList(item.requiredAttendees, function (req) {
          getList(item.optionalAttendees, function (opt) {
            getVal(item.organizer, function (org) {
              var seen = {}, att = [];
              [].concat(org ? [org] : [], req || [], opt || []).forEach(function (p) {
                var a = ((p && p.emailAddress) || '').trim().toLowerCase();
                if (!a || a === me || seen[a]) return;
                seen[a] = 1; att.push([a, p.displayName || '']);
              });
              var d = start ? new Date(start) : new Date();
              var u = crm + '/#/reunion?sujet=' + encodeURIComponent(subject || '') + '&date=' + encodeURIComponent(d.toISOString().slice(0, 10)) + '&a=' + encodeURIComponent(JSON.stringify(att));
              $('subj').textContent = subject || '(sans objet)';
              $('list').innerHTML = att.length
                ? att.map(function (x) { return '<div class="p"><div class="t"><b>' + esc(x[1] || x[0]) + '</b><span class="e">' + esc(x[0]) + '</span></div></div>'; }).join('') +
                  '<p><a class="btn" style="display:inline-block" target="_blank" rel="noopener" href="' + esc(u) + '">Ajouter la réunion au CRM</a></p>'
                : '<p class="mu">Aucun participant à ajouter.</p>';
            });
          });
        });
      });
    });
  }
  $('log').addEventListener('change', draw);
  function load() { item = Office.context.mailbox.item; draw(); }
  Office.onReady(function () {
    load();
    if (Office.context.mailbox.addHandlerAsync) Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged, load);
  });
})();
</script>
</body>
</html>
